[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warrantxai"
version = "0.1.0"
description = "Fixed-formula Warrant Index for synthetic explanation credibility audits"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6", "pytest-cov>=5"]
dev = ["build>=1", "ruff>=0.11"]
realdata = [
    "lifelines>=0.30",
    "pyarrow>=14",
    "requests>=2.31",
    "joblib>=1.4",
    "scikit-survival>=0.28",
    "shap>=0.52",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["warrantxai*"]

[tool.coverage.run]
branch = true
source = ["warrantxai"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
